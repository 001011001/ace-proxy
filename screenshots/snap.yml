 base: API_BASE, token: function(){return V.token||localStorage.getItem('ace_jwt')||''}, setToken: function(t){V.token=t;if(t)localStorage.setItem('ace_jwt',t);else localStorage.removeItem('ace_jwt')}, get: async function(path,params){var u=this.base+path;if(params){var q=new URLSearchParams(params).toString();u+='?'+q;}var h={'Accept':'application/json'};if(this.token())h['Authorization']='Bearer '+this.token();try{var r=await fetch(u,{headers:h});if(!r.ok)throw new Error(r.status);return await r.json();}catch(e){if(DEBUG)console.warn('API GET '+path,e);return null;}}, post: async function(path,body){var u=this.base+path;var h={'Content-Type':'application/json','Accept':'application/json'};if(this.token())h['Authorization']='Bearer '+this.token();try{var r=await fetch(u,{method:'POST',headers:h,body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return await r.json();}catch(e){if(DEBUG)console.warn('API POST '+path,e);return null;}}, put: async function(path,body){var u=this.base+path;var h={'Content-Type':'application/json','Accept':'application/json'};if(this.token())h['Authorization']='Bearer '+this.token();try{var r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return await r.json();}catch(e){if(DEBUG)console.warn('API PUT '+path,e);return null;}}, del: async function(path){var u=this.base+path;var h={'Accept':'application/json'};if(this.token())h['Authorization']='Bearer '+this.token();try{var r=await fetch(u,{method:'DELETE',headers:h});if(!r.ok)throw new Error(r.status);return await r.json();}catch(e){if(DEBUG)console.warn('API DELETE '+path,e);return null;}} }; function initAPI(){if(typeof window!=='undefined'&&window.API&&window.API.API_BASE){API_BASE=window.API.API_BASE;A.base=API_BASE;var t=window.API.getToken();if(t){V.token=t;A.setToken(t);}}} // ==================== MOCK DATA (fallback when API unavailable) ==================== var MOCK = { products: [ {id:'EID-JKT-001',name:'Wireless E