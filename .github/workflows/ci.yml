name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 阶段1: 代码检查（每次push/PR都跑） ──
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── 阶段2: 冒烟测试（main分支才跑） ──
  smoke-test:
    needs: lint-and-typecheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ace_proxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-dir: apps/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push DB schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ace_proxy

      - name: Seed test data
        run: node seed-100-products.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ace_proxy

      - name: Start server
        run: node dist/src/main.js &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ace_proxy
          PORT: 3001
          JWT_SECRET: ci-test-secret
          NODE_ENV: development
          OLLAMA_URL: ""

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3001/api/v1/health && break
            sleep 2
          done

      - name: Smoke test — Health
        run: curl -sf http://localhost:3001/api/v1/health

      - name: Smoke test — Products
        run: curl -sf http://localhost:3001/api/v1/product/list?limit=1 | grep '"total"'

      - name: Smoke test — Auth Register
        run: |
          curl -sf -X POST http://localhost:3001/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"test@ci.local","password":"Test1234"}'

      - name: Smoke test — Auth Login
        run: |
          curl -sf -X POST http://localhost:3001/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@ci.local","password":"Test1234"}'

      - name: Smoke test — KPI
        run: curl -sf http://localhost:3001/api/v1/dashboard/kpi

  # ── 阶段3: 部署前端（main分支push才跑） ──
  deploy-frontend:
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to CloudStudio
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/aceproxy
            git pull origin main
            cp -r deploy/* /var/www/html/
            systemctl reload nginx
