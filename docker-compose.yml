version: '3.8'

services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: aceproxy_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AceProxy2026!}
      POSTGRES_DB: aceproxy_vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://aceproxy_admin:${DB_PASSWORD:-AceProxy2026!}@db:5432/aceproxy_vault
      JWT_SECRET: ${JWT_SECRET:-AceProxySecret2026}
      XENDIT_API_KEY: ${XENDIT_API_KEY}
    depends_on:
      - db

volumes:
  postgres_data:
